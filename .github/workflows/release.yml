name: Build Release

on:
  push:
    tags:
      - 'v*'
  # A manual run builds, checks and packages every platform as workflow
  # artifacts; only version tags publish a release.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in Ubuntu 20.04 so the binary needs at most
          # glibc 2.31 and starts on older distributions and mining OSes.
          - os: ubuntu-latest
            container: ubuntu:20.04
            target: x86_64-unknown-linux-gnu
            name: seine-linux-x86_64
            # NVIDIA (default) plus the AMD HIP backend; both resolve their
            # runtimes at startup via dlopen, so the build needs neither toolkit.
            features: --features amd
          - os: ubuntu-24.04-arm
            container: ubuntu:20.04
            target: aarch64-unknown-linux-gnu
            name: seine-linux-aarch64
            features: --no-default-features
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: seine-windows-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: seine-macos-x86_64
            features: --no-default-features
          - os: macos-15
            target: aarch64-apple-darwin
            name: seine-macos-aarch64
            features: --no-default-features --features metal

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      # Set only after HTTPS ingestion and the published privacy policy are verified.
      SEINE_TELEMETRY_URL: ${{ vars.SEINE_TELEMETRY_URL }}

    steps:
      - name: Install build tools (container)
        if: matrix.container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features || '' }}

      - name: Verify native Linux ARM CPU kernels
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cargo test --release --locked --target ${{ matrix.target }} -p blocknet-pow-kernel
          cargo run --release --locked --target ${{ matrix.target }} -p blocknet-pow-kernel --example verify_cpu_kernels

      - name: Check Linux glibc requirement
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          newest=$(objdump -T "target/${{ matrix.target }}/release/seine" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: ${newest}"
          test "$(printf '%s\n' "${newest#GLIBC_}" 2.31 | sort -V | tail -1)" = 2.31

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/${{ matrix.name }}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/seine" "${stage}/seine"
          cp LICENSE "${stage}/SEINE-LICENSE.txt"
          cp README.md "${stage}/README.md"
          cp PRIVACY.md "${stage}/PRIVACY.md"
          (
            cd "${stage}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum PRIVACY.md README.md SEINE-LICENSE.txt seine > SHA256SUMS.txt
            else
              shasum -a 256 PRIVACY.md README.md SEINE-LICENSE.txt seine > SHA256SUMS.txt
            fi
          )
          tar -C "${stage}" -czf "${GITHUB_WORKSPACE}/${{ matrix.name }}.tar.gz" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nvrtcVersion = '12.8.61'
          $nvrtcArchive = "cuda_nvrtc-windows-x86_64-$nvrtcVersion-archive.zip"
          $nvrtcUrl = "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvrtc/windows-x86_64/$nvrtcArchive"
          $nvrtcSha256 = 'e43603b09f8a52d681ceb814c00b655af19da53692ab91671dabbf8071c8f93d'
          $nvrtcExtract = Join-Path $env:RUNNER_TEMP 'seine-nvrtc'
          $stage = Join-Path $env:RUNNER_TEMP '${{ matrix.name }}'

          Invoke-WebRequest -Uri $nvrtcUrl -OutFile $nvrtcArchive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $nvrtcArchive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $nvrtcSha256) {
            throw "NVRTC archive checksum mismatch: expected $nvrtcSha256, got $actualSha256"
          }

          Expand-Archive -LiteralPath $nvrtcArchive -DestinationPath $nvrtcExtract
          $nvrtcRoot = Join-Path $nvrtcExtract "cuda_nvrtc-windows-x86_64-$nvrtcVersion-archive"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/seine.exe' $stage
          Copy-Item (Join-Path $nvrtcRoot 'bin/nvrtc64_120_0.dll') $stage
          Copy-Item (Join-Path $nvrtcRoot 'bin/nvrtc-builtins64_128.dll') $stage
          Copy-Item 'LICENSE' (Join-Path $stage 'SEINE-LICENSE.txt')
          Copy-Item (Join-Path $nvrtcRoot 'LICENSE') (Join-Path $stage 'NVIDIA-CUDA-NVRTC-LICENSE.txt')
          Copy-Item 'README.md' $stage
          Copy-Item 'PRIVACY.md' $stage

          Get-ChildItem $stage -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $stage 'SHA256SUMS.txt')

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath '${{ matrix.name }}.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate archive checksums
        run: sha256sum seine-*.tar.gz seine-*.zip > SHA256SUMS.txt

      - name: Sign archive checksums
        env:
          SEINE_RELEASE_SIGNING_KEY: ${{ secrets.SEINE_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SEINE_RELEASE_SIGNING_KEY" || { echo "::error::SEINE_RELEASE_SIGNING_KEY secret is missing; the miner refuses unsigned releases"; exit 1; }
          umask 077
          printf '%s\n' "$SEINE_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/signing.pem" -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          rm -f "$RUNNER_TEMP/signing.pem"
          # The miner embeds the matching public key (src/self_update.rs); verify here too.
          cat > "$RUNNER_TEMP/signing.pub" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEA9grQMoR5CXIcecwpn+EmZTEZ9D0e5QhkpWbQi+8K7O4=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/signing.pub" -rawin -in SHA256SUMS.txt -sigfile SHA256SUMS.txt.sig
          test "$(wc -c < SHA256SUMS.txt.sig)" -eq 64

      - name: Extract changelog section for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "([[:space:]]|$)" { found = 1; next }
            /^## v/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then
            echo "Using CHANGELOG.md section for $GITHUB_REF_NAME"
          else
            echo "::warning::No CHANGELOG.md section for $GITHUB_REF_NAME; release body will only have the full-changelog link"
          fi

          # Keep the comparison link without publishing the generated commit list.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq '.body' > GENERATED_NOTES.md
          printf '\n' >> RELEASE_NOTES.md
          sed -n '/^\*\*Full Changelog\*\*:/p' GENERATED_NOTES.md >> RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            SHA256SUMS.txt
            SHA256SUMS.txt.sig
            seine-*.tar.gz
            seine-*.zip
          generate_release_notes: false

  # HiveOS custom miner package (docs/guides/hiveos.md), built from the Linux
  # x86_64 release archive and added to the published release. It runs after
  # the release exists and cannot fail it.
  hiveos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: seine-linux-x86_64

      - name: Package
        run: packaging/hiveos/build.sh --archive seine-linux-x86_64.tar.gz --version "$GITHUB_REF_NAME" --out-dir dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/seine-hiveos-*.tar.gz

  # mmpOS custom miner package (docs/guides/mmpos.md), built the same way as
  # the HiveOS package and added to the published release. It runs after the
  # release exists and cannot fail it.
  mmpos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: seine-linux-x86_64

      - name: Package
        run: packaging/mmpos/build.sh --archive seine-linux-x86_64.tar.gz --version "$GITHUB_REF_NAME" --out-dir dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/seine-mmpos-*.tar.gz
