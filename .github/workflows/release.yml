name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: seine-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: seine-windows-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: seine-macos-x86_64
            features: --no-default-features
          - os: macos-15
            target: aarch64-apple-darwin
            name: seine-macos-aarch64
            features: --no-default-features --features metal

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features || '' }}

      - name: Package (Unix)
        if: runner.os != 'Windows' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz seine

      - name: Package (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nvrtcVersion = '12.8.61'
          $nvrtcArchive = "cuda_nvrtc-windows-x86_64-$nvrtcVersion-archive.zip"
          $nvrtcUrl = "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvrtc/windows-x86_64/$nvrtcArchive"
          $nvrtcSha256 = 'e43603b09f8a52d681ceb814c00b655af19da53692ab91671dabbf8071c8f93d'
          $nvrtcExtract = Join-Path $env:RUNNER_TEMP 'seine-nvrtc'
          $stage = Join-Path $env:RUNNER_TEMP '${{ matrix.name }}'

          Invoke-WebRequest -Uri $nvrtcUrl -OutFile $nvrtcArchive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $nvrtcArchive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $nvrtcSha256) {
            throw "NVRTC archive checksum mismatch: expected $nvrtcSha256, got $actualSha256"
          }

          Expand-Archive -LiteralPath $nvrtcArchive -DestinationPath $nvrtcExtract
          $nvrtcRoot = Join-Path $nvrtcExtract "cuda_nvrtc-windows-x86_64-$nvrtcVersion-archive"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/seine.exe' $stage
          Copy-Item (Join-Path $nvrtcRoot 'bin/nvrtc64_120_0.dll') $stage
          Copy-Item (Join-Path $nvrtcRoot 'bin/nvrtc-builtins64_128.dll') $stage
          Copy-Item 'LICENSE' (Join-Path $stage 'SEINE-LICENSE.txt')
          Copy-Item (Join-Path $nvrtcRoot 'LICENSE') (Join-Path $stage 'NVIDIA-CUDA-NVRTC-LICENSE.txt')
          Copy-Item 'README.md' $stage

          Get-ChildItem $stage -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $stage 'SHA256SUMS.txt')

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath '${{ matrix.name }}.zip'

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            seine-*.tar.gz
            seine-*.zip
          generate_release_notes: true
