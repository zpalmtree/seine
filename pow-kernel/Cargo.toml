[package]
name = "blocknet-pow-kernel"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[lib]
name = "blocknet_pow_kernel"
path = "src/lib.rs"

[features]
default = []
# Experimental online reduced-memory hashing; absent from production builds.
cpu-research = []
avx512 = []

[dependencies]
blake2 = "0.10"

[dev-dependencies]
argon2 = "0.5"

[[example]]
name = "mine_reduced"
required-features = ["cpu-research"]
