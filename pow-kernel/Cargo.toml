[package]
name = "blocknet-pow-kernel"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[lib]
name = "blocknet_pow_kernel"
path = "src/lib.rs"

[features]
default = []
avx512 = []
# Offline dependency/recomputation research; never enabled by the miner.
cpu-research = []

[[example]]
name = "cpu_tmto"
required-features = ["cpu-research"]

[dependencies]
blake2 = "0.10"

[dev-dependencies]
argon2 = "0.5"
