[package]
name = "seine"
version = "0.2.45"
edition = "2021"
license = "BSD-3-Clause"

[workspace]
members = ["pow-kernel", "pow-spec", "telemetry"]
resolver = "2"

[dependencies]
seine-telemetry = { path = "telemetry" }
anyhow = "1.0"
base64 = "0.22"
ring = "0.17"
async-stream = "0.3"
argon2 = "0.5"
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
blake2 = "0.10"
bs58 = "0.5"
clap = { version = "4.5", features = ["derive"] }
curve25519-dalek = "4.1"
crossterm = "0.28"
ctrlc = { version = "3.4", features = ["termination"] }
crossbeam-channel = "0.5"
core_affinity = "0.8"
getrandom = "0.2"
# Keep CUDA 12.0 bindings; cudarc >=0.19.5 loads driver symbols only when used.
# NVRTC 12.8 remains bundled and runtime GPU architecture selection is unchanged.
cudarc = { version = "0.19.5", default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-12000"], optional = true }
flate2 = "1"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
ratatui = "0.29"
blocknet-pow-spec = { path = "./pow-spec" }
blocknet-pow-kernel = { path = "./pow-kernel" }
sysinfo = "0.31"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-http = { version = "0.5", features = ["cors"] }
webpki-roots = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[features]
default = ["nvidia"]
nvidia = ["dep:cudarc"]
metal = ["dep:metal"]
# HIP/ROCm backend for AMD GPUs. OFF by default. Compiles on stable Rust
# without ROCm headers/toolkit installed: all HIP/hipRTC FFI is hand-declared
# and resolved at runtime via dlopen (libamdhip64.so / libhiprtc.so).
amd = []

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
httpmock = "0.7"
rcgen = "0.13"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "fat"
# NOTE: Do not add `panic = "abort"` here. The miner uses `catch_unwind` in
# production code paths (backend_executor.rs) to gracefully handle panics from
# backend stop/execution calls. Setting panic = "abort" would bypass those
# catch_unwind guards and cause the entire process to terminate on any backend panic.

[profile.release-native]
inherits = "release"
